services:
  traefik:
    image: traefik:v3.1
    container_name: kasyno_traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  postgres:
    image: postgres:17-alpine
    container_name: kasyno_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kasyno}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kasyno_pass}
      POSTGRES_DB: ${POSTGRES_DB:-kasyno}
    volumes:
      - casino_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kasyno} -d ${POSTGRES_DB:-kasyno}"]
      interval: 5s
      timeout: 5s
      retries: 5

  kasyno_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kasyno_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PORT=8080
      - APP_URL=${APP_URL:-https://kasyno.twojadomena.pl}
      - DATABASE_URL=${DATABASE_URL:-postgres://kasyno:kasyno_pass@postgres:5432/kasyno?sslmode=disable}
      - SESSION_SECRET=${SESSION_SECRET:-kasyno-2fgt-secret-key-replace-in-env-production-32-chars}
      - AUTHENTIK_ISSUER=${AUTHENTIK_ISSUER}
      - AUTHENTIK_CLIENT_ID=${AUTHENTIK_CLIENT_ID}
      - AUTHENTIK_CLIENT_SECRET=${AUTHENTIK_CLIENT_SECRET}
      - AUTHENTIK_AUTH_URL=${AUTHENTIK_AUTH_URL:-}
      - AUTHENTIK_TOKEN_URL=${AUTHENTIK_TOKEN_URL:-}
      - AUTHENTIK_USERINFO_URL=${AUTHENTIK_USERINFO_URL:-}
      - AUTHENTIK_END_SESSION_URL=${AUTHENTIK_END_SESSION_URL:-}
      - DEV_AUTH_ENABLED=${DEV_AUTH_ENABLED:-false}
      - DEFAULT_BALANCE=${DEFAULT_BALANCE:-1000}
      - DAILY_MISSION_TARGET=${DAILY_MISSION_TARGET:-5}
      - DAILY_MISSION_REWARD=${DAILY_MISSION_REWARD:-250}
      - DISCORD_ERROR_WEBHOOK_URL=${DISCORD_ERROR_WEBHOOK_URL:-}
      - DISCORD_SECURITY_WEBHOOK_URL=${DISCORD_SECURITY_WEBHOOK_URL:-}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID:-}
      - DISCORD_ADMIN_ROLE=${DISCORD_ADMIN_ROLE:-}
      - DISCORD_ADMIN_USER_IDS=${DISCORD_ADMIN_USER_IDS:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - ./logs:/app/logs
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=PathPrefix(`/api`) || PathPrefix(`/ws`) || PathPrefix(`/health`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.routers.backend.priority=20"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"

  kasyno_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kasyno_frontend
    restart: unless-stopped
    depends_on:
      kasyno_backend:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

volumes:
  casino_pgdata:
    driver: local
