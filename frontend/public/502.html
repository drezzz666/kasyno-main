<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Przerwa techniczna — 2F KASYNO</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #090a0f;
      --card-bg: #12141c;
      --card-border: rgba(255, 255, 255, 0.08);
      --gold: #f59e0b;
      --gold-glow: rgba(245, 158, 11, 0.25);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --green: #10b981;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Background Glow */
    .ambient-glow {
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 500px;
      height: 350px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.12) 0%, rgba(9, 10, 15, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 2.25rem 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.03);
      text-align: center;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Brand Header */
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1.75rem;
      text-decoration: none;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--gold);
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
      box-shadow: 0 0 20px var(--gold-glow);
    }

    .brand-name {
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      color: #fff;
    }

    /* Status Icon & Pulse */
    .icon-wrapper {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      position: relative;
    }

    .icon-wrapper svg {
      width: 34px;
      height: 34px;
      color: var(--gold);
      animation: rotateTool 4s ease-in-out infinite;
    }

    @keyframes rotateTool {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-10deg); }
      75% { transform: rotate(10deg); }
    }

    .pulse-ring {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 2px solid rgba(245, 158, 11, 0.3);
      animation: pulse 2.5s cubic-bezier(0.24, 0, 0.38, 1) infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 0; }
      100% { transform: scale(0.95); opacity: 0; }
    }

    /* Heading & Description */
    h1 {
      font-size: 1.45rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 0.75rem;
      letter-spacing: -0.02em;
    }

    p {
      color: var(--text-muted);
      font-size: 0.925rem;
      line-height: 1.55;
      margin-bottom: 1.75rem;
    }

    /* Status Cards */
    .status-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 1.75rem;
      text-align: left;
    }

    .status-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 0.85rem;
    }

    .status-card-label {
      font-size: 0.725rem;
      color: var(--text-dim);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
    }

    .status-card-value {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.825rem;
      font-weight: 700;
      color: #e2e8f0;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    .dot.amber {
      background: var(--gold);
      box-shadow: 0 0 8px var(--gold);
    }

    .dot.green {
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
    }

    /* Progress & Countdown */
    .progress-wrapper {
      margin-bottom: 1.5rem;
    }

    .countdown-text {
      font-size: 0.825rem;
      color: var(--text-dim);
      margin-bottom: 0.6rem;
      font-variant-numeric: tabular-nums;
    }

    .countdown-text strong {
      color: var(--gold);
    }

    .progress-bar {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #f59e0b, #fbbf24);
      width: 100%;
      transition: width 1s linear;
      border-radius: 999px;
    }

    /* Action Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      background: var(--gold);
      color: #000;
      font-weight: 800;
      font-size: 0.925rem;
      padding: 0.8rem 1.25rem;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.2);
    }

    .btn:hover {
      background: #fbbf24;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.35);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn.loading {
      opacity: 0.75;
      cursor: wait;
    }

    /* Footer */
    .footer {
      margin-top: 1.5rem;
      font-size: 0.775rem;
      color: var(--text-dim);
    }

    .spinner {
      animation: spin 1s linear infinite;
      display: none;
    }

    .btn.loading .spinner {
      display: inline-block;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>

  <div class="container">
    <!-- Brand -->
    <div class="brand">
      <div class="brand-logo">2F</div>
      <span class="brand-name">KASYNO</span>
    </div>

    <!-- Status Icon -->
    <div class="icon-wrapper">
      <div class="pulse-ring"></div>
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
    </div>

    <!-- Text -->
    <h1>Przerwa techniczna</h1>
    <p>
      Trwają krótkie prace konserwacyjne lub aktualizacja serwerów kasyna.
      Zaraz wracamy do gry!
    </p>

    <!-- Status Cards -->
    <div class="status-grid">
      <div class="status-card">
        <div class="status-card-label">Stan serwerów</div>
        <div class="status-card-value">
          <span class="dot amber"></span>
          <span>Konserwacja</span>
        </div>
      </div>
      <div class="status-card">
        <div class="status-card-label">Stan portfela</div>
        <div class="status-card-value">
          <span class="dot green"></span>
          <span>Środki bezpieczne</span>
        </div>
      </div>
    </div>

    <!-- Auto-retry bar -->
    <div class="progress-wrapper">
      <div class="countdown-text" id="countdown-label">
        Automatyczne sprawdzenie za: <strong id="timer">10s</strong>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>

    <!-- Action -->
    <button class="btn" id="retry-btn" onclick="checkStatus()">
      <svg class="spinner" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-opacity="0.25"></circle>
        <path d="M12 2a10 10 0 0 1 10 10" stroke="currentColor"></path>
      </svg>
      <span id="btn-text">Sprawdź ponownie</span>
    </button>

    <div class="footer">
      2F KASYNO &bull; Wszystkie dane i postępy są nienaruszone
    </div>
  </div>

  <script>
    const TOTAL_SECONDS = 10;
    let remaining = TOTAL_SECONDS;
    let isChecking = false;

    const timerEl = document.getElementById('timer');
    const progressEl = document.getElementById('progress-fill');
    const retryBtn = document.getElementById('retry-btn');
    const btnText = document.getElementById('btn-text');

    function updateProgress() {
      const pct = (remaining / TOTAL_SECONDS) * 100;
      progressEl.style.width = pct + '%';
      timerEl.textContent = remaining + 's';
    }

    async function checkStatus() {
      if (isChecking) return;
      isChecking = true;
      retryBtn.classList.add('loading');
      btnText.textContent = 'Sprawdzanie...';

      try {
        const res = await fetch('/health?_t=' + Date.now(), {
          method: 'GET',
          cache: 'no-store'
        });
        if (res.ok) {
          btnText.textContent = 'Dostępne! Przekierowanie...';
          setTimeout(() => {
            window.location.href = '/';
          }, 300);
          return;
        }
      } catch (err) {
        // Still down
      }

      // If still down
      setTimeout(() => {
        isChecking = false;
        retryBtn.classList.remove('loading');
        btnText.textContent = 'Sprawdź ponownie';
        remaining = TOTAL_SECONDS;
        updateProgress();
      }, 700);
    }

    setInterval(() => {
      if (isChecking) return;
      remaining--;
      if (remaining <= 0) {
        checkStatus();
      } else {
        updateProgress();
      }
    }, 1000);

    updateProgress();
  </script>
</body>
</html>
