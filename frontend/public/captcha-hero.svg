<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b101d"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
    <radialGradient id="glowAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="30%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <circle cx="200" cy="120" r="140" fill="url(#glowAmber)"/>
  <circle cx="120" cy="80" r="100" fill="url(#glowCyan)"/>

  <!-- Futuristic Grid lines -->
  <g stroke="rgba(245, 158, 11, 0.08)" stroke-width="1">
    <line x1="0" y1="40" x2="400" y2="40"/>
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="60" y1="0" x2="60" y2="250"/>
    <line x1="120" y1="0" x2="120" y2="250"/>
    <line x1="180" y1="0" x2="180" y2="250"/>
    <line x1="240" y1="0" x2="240" y2="250"/>
    <line x1="300" y1="0" x2="300" y2="250"/>
    <line x1="360" y1="0" x2="360" y2="250"/>
  </g>

  <!-- Digital Circuit Accent Lines -->
  <path d="M 40 180 L 100 180 L 140 140 L 170 140" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.4"/>
  <circle cx="40" cy="180" r="3" fill="#06b6d4" fill-opacity="0.6"/>
  <circle cx="170" cy="140" r="3" fill="#06b6d4" fill-opacity="0.6"/>

  <path d="M 360 80 L 300 80 L 260 110 L 230 110" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.4"/>
  <circle cx="360" cy="80" r="3" fill="#f59e0b" fill-opacity="0.6"/>
  <circle cx="230" cy="110" r="3" fill="#f59e0b" fill-opacity="0.6"/>

  <!-- Central Cyber Shield Faucet -->
  <g transform="translate(200, 115) scale(1.15)" filter="url(#neonGlow)">
    <!-- Shield Outer Ring -->
    <path d="M 0 -60 Q 45 -55 50 -10 Q 55 45 0 75 Q -55 45 -50 -10 Q -45 -55 0 -60 Z" 
          fill="none" stroke="#f59e0b" stroke-width="3" stroke-opacity="0.8"/>
    
    <!-- Shield Solid Core -->
    <path d="M 0 -52 Q 38 -48 42 -10 Q 46 38 0 65 Q -46 38 -42 -10 Q -38 -48 0 -52 Z" 
          fill="url(#shieldGrad)"/>

    <!-- Inner Shield Depth -->
    <path d="M 0 -42 Q 28 -38 30 -8 Q 33 28 0 50 Q -33 28 -30 -8 Q -28 -38 0 -42 Z" 
          fill="#111827" fill-opacity="0.85"/>

    <!-- Keyhole & Checkmark Hologram -->
    <path d="M -14 2 L -4 12 L 16 -8" fill="none" stroke="#34d399" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Floating Puzzle Particles -->
    <rect x="-35" y="-30" width="8" height="8" rx="2" fill="#06b6d4" fill-opacity="0.8"/>
    <rect x="28" y="15" width="7" height="7" rx="2" fill="#fbbf24" fill-opacity="0.8"/>
  </g>

  <!-- Glowing Code / Captcha Characters floating -->
  <text x="75" y="90" fill="#06b6d4" font-family="monospace" font-size="16" font-weight="900" opacity="0.4">5 + 9</text>
  <text x="290" y="175" fill="#f59e0b" font-family="monospace" font-size="15" font-weight="900" opacity="0.5">7 K 9 X</text>
  <text x="310" y="65" fill="#34d399" font-family="monospace" font-size="14" font-weight="800" opacity="0.4">✓ 40 $FGT</text>
</svg>
