map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep redirects relative so browser stays on domain (e.g. zagraj.2fgt.pl)
    absolute_redirect off;

    # Trust Traefik / Docker ingress network for real client IP extraction
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # High-performance static serving & TCP optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip Compression for all text, scripts, styles, json, and vectors
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml
        font/woff
        font/woff2;

    # Custom Error Page for Server Offline / 502 Bad Gateway
    error_page 500 502 503 504 /offline.html;
    location = /offline.html {
        root /usr/share/nginx/html;
    }

    # Internal subrequest for checking Authentik session
    location = /_auth_verify {
        internal;
        proxy_pass http://kasyno_backend:8080/api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Remote-Ip $http_x_remote_ip;
        proxy_set_header CF-Connecting-Ip $http_cf_connecting_ip;
    }

    # Redirect unauthenticated requests directly to Authentik login flow
    location @login_redirect {
        return 302 /api/auth/login;
    }

    # Vite Hashed Production Chunks (Assets in /assets/* never change without new hash)
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Static Media Assets (images, audio, fonts)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|m4a|mp3|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Proxy Backend API & Health
    location /api/ {
        proxy_pass http://kasyno_backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Cookie $http_cookie;
    }

    # Proxy WebSocket
    location /ws {
        proxy_pass http://kasyno_backend:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # SPA Routing (STRICTLY requires Authentik session, redirects to login if unauthenticated)
    location / {
        auth_request /_auth_verify;
        error_page 401 = @login_redirect;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        try_files $uri $uri/ /index.html;
    }
}
