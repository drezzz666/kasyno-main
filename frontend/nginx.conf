server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Custom Error Page for Server Offline / 502 Bad Gateway
    error_page 500 502 503 504 /offline.html;
    location = /offline.html {
        root /usr/share/nginx/html;
    }

    # Internal subrequest for checking Authentik session
    location = /_auth_verify {
        internal;
        proxy_pass http://kasyno_backend:8080/api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirect unauthenticated requests directly to Authentik login flow
    location @login_redirect {
        return 302 /api/auth/login;
    }

    # Healthcheck Proxy for Auto-Recovery (Public)
    location /health {
        proxy_pass http://kasyno_backend:8080/health;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
    }

    # Auth routes (Public: login, callback, logout, verify, etc.)
    location /api/auth/ {
        proxy_pass http://kasyno_backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Authenticated API Reverse Proxy to Go Backend
    location /api/ {
        auth_request /_auth_verify;
        proxy_pass http://kasyno_backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Authenticated WebSocket Reverse Proxy to Go Backend
    location /ws {
        auth_request /_auth_verify;
        proxy_pass http://kasyno_backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Static Assets (STRICTLY requires Authentik session, redirects to login if unauthenticated)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|m4a|mp3|woff|woff2)$ {
        auth_request /_auth_verify;
        error_page 401 = @login_redirect;
        expires 7d;
        add_header Cache-Control "private, no-transform";
    }

    # SPA Routing (STRICTLY requires Authentik session, redirects to login if unauthenticated)
    location / {
        auth_request /_auth_verify;
        error_page 401 = @login_redirect;
        try_files $uri $uri/ /index.html;
    }
}
